<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quad Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b2a41; --gold:#a98b4f; --paper:#f8f5ee; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #fffdf8 0%, var(--paper) 70%, #efe9dc 100%);
    color: var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  h1 {
    font-family:'Cinzel', 'Cormorant Garamond', Georgia, serif;
    font-weight:400; font-size:clamp(2rem, 7vw, 4.5rem);
    letter-spacing:.28em; text-transform:uppercase; padding-left:.28em;
  }
  .rule { width:72px; height:1px; background:var(--gold); margin:2.2rem auto; }
  a {
    font-size:1.15rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ink); text-decoration:none; padding-bottom:.35rem;
    border-bottom:1px solid var(--gold); transition:color .3s, border-color .3s;
  }
  a:hover { color:var(--gold); }
</style>
</head>
<body>
  <h1>Quad Foundation</h1>
  <div class="rule"></div>
  <a href="mailto:info@quad.to">Contact us</a>
</body>
</html>
